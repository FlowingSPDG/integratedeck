[workspace]
resolver = "2"
members = [
    "crates/ideck-core",
    "crates/ideck-surface",
    "crates/ideck-sd-host",
    "crates/ideck-comp-host",
    "crates/ideck-bridge",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["integratedeck contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
tokio-tungstenite = "0.26"
tungstenite = "0.26"

ideck-core = { path = "crates/ideck-core" }
ideck-surface = { path = "crates/ideck-surface" }
ideck-sd-host = { path = "crates/ideck-sd-host" }
ideck-comp-host = { path = "crates/ideck-comp-host" }
ideck-bridge = { path = "crates/ideck-bridge" }
