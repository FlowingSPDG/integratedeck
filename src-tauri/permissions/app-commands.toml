  "list_connections",
  "add_connection",
  "remove_connection",
  "execute_companion_action",
  "companion_ping",
  "get_pi_url",
  "get_pi_context",
  "focus_pi_slot",
  "get_cell_visuals",
  "get_property_inspector_url",
  "list_plugin_actions",
  "update_slot_settings",
