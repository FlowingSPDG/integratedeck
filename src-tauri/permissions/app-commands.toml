description = "Allow integratedeck frontend to call app IPC commands"
commands.allow = [
  "get_app_info",
  "list_surfaces",
  "get_profile",
  "save_profile",
  "scan_plugins",
  "scan_hid_devices",
  "list_surface_drivers",
  "connect_hid_device",
  "open_plugins_folder",
